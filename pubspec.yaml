name: rum_tap
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/pad/sound_effect/
    - assets/pad/sound/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000" # สีพื้นหลัง (หรือใส่เป็นพาธรูปภาพก็ได้)
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png" # รูปโลโก้ตรงกลางที่เป็นพื้นหลังโปร่งใส
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000" # ตั้งค่าหน้าจอตอนเปิดแอปให้เป็นสีดำ
  image: "assets/icon/icon.png" # รูปโลโก้ตรงกลางตอนเปิดแอป

  android_12:
    color: "#000000"
    image: "assets/images/rum_pad_icon.png"
